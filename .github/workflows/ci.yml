name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-check:
    name: Windows Check and Build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            libs/os_api -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --features windows --bin cpu-affinity-tool -- -D warnings

      - name: Run os_api tests
        run: cargo test --manifest-path libs/os_api/Cargo.toml

      - name: Check background test code
        run: cargo clippy --locked --manifest-path libs/os_api/Cargo.toml --features tuning-test-controls --tests -- -D warnings

      - name: Test background protocol and closed role admission
        shell: pwsh
        run: ./scripts/test-windows-background-workload.ps1

      - name: Run tests
        run: cargo test --features windows --bin cpu-affinity-tool

      - name: Check debug launcher isolation
        shell: pwsh
        run: ./scripts/Start-mcp-debug.ps1 -SelfTest

      - name: Check debug MCP protocol
        run: |
          python scripts/test_cpu_affinity_mcp.py
          python scripts/test_live_mcp.py

      - name: Check README screenshot assets
        run: |
          python scripts/test_readme_screenshots.py
          python scripts/check-readme-screenshots.py

      - name: Check platform renderer dependencies
        run: python scripts/test-renderer-dependencies.py

      - name: Run headless debug MCP tests
        run: cargo test --features windows,debug-mcp,diagnostics-test-controls --bin cpu-affinity-tool debug_mcp

      - name: Test local eframe frame deferral
        shell: pwsh
        run: |
          Copy-Item -LiteralPath Cargo.lock -Destination vendor/eframe/Cargo.lock
          try {
            cargo test --manifest-path vendor/eframe/Cargo.toml --lib --no-default-features --features accesskit,default_fonts,glow,wayland,x11 --target-dir target frame_
            if ($LASTEXITCODE -ne 0) { throw 'Local eframe regression tests failed' }
          } finally {
            Remove-Item -LiteralPath vendor/eframe/Cargo.lock
          }

      - name: Test local Winit DPI rectangle policy
        shell: pwsh
        run: |
          Copy-Item -LiteralPath Cargo.lock -Destination vendor/winit/Cargo.lock
          try {
            cargo test --manifest-path vendor/winit/Cargo.toml --lib --no-default-features --features rwh_06 --target-dir target dpi_
            if ($LASTEXITCODE -ne 0) { throw 'Local Winit DPI regression tests failed' }
          } finally {
            Remove-Item -LiteralPath vendor/winit/Cargo.lock
          }

      - name: Test local epaint hinting compatibility
        shell: pwsh
        run: |
          Copy-Item -LiteralPath Cargo.lock -Destination vendor/epaint/Cargo.lock
          try {
            cargo test --manifest-path vendor/epaint/Cargo.toml --lib --target-dir target
            if ($LASTEXITCODE -ne 0) { throw 'Local epaint regression tests failed' }
          } finally {
            Remove-Item -LiteralPath vendor/epaint/Cargo.lock
          }

      - name: Run Windows tuning recovery probes
        shell: pwsh
        run: ./scripts/test-windows-tuning-recovery.ps1

      - name: Verify committed lockfiles
        run: git diff --exit-code -- Cargo.lock libs/os_api/Cargo.lock

      - name: Build Windows release binary
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Report Windows artifact sizes
        shell: pwsh
        run: Get-Item target/release/cpu-affinity-tool.exe, target/release/cpu_affinity_tool.pdb | Select-Object Name, Length

      - name: Verify Windows debug symbols
        shell: pwsh
        run: |
          ./scripts/test-windows-pdb-verifier.ps1 `
            -ExePath target/release/cpu-affinity-tool.exe `
            -PdbPath target/release/cpu_affinity_tool.pdb

      - name: Run Windows crash report probes
        shell: pwsh
        run: ./scripts/test-windows-crash-reports.ps1 -WithDebugMcp

      - name: Run synthetic built-app MCP scenarios
        shell: pwsh
        run: ./scripts/test-windows-live-mcp.ps1 -SkipBuild

      - name: Upload live MCP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-live-mcp-evidence
          path: target/lm-*/evidence/result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Windows release manifest
        shell: pwsh
        run: ./scripts/assert-windows-release-manifest.ps1 -Path target/release/cpu-affinity-tool.exe

  linux-beta-check:
    name: Linux Beta Check and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            libs/os_api -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check README screenshot assets
        run: |
          python scripts/test_readme_screenshots.py
          python scripts/check-readme-screenshots.py

      - name: Run clippy
        run: cargo clippy --features linux --bin cpu-affinity-tool-linux -- -D warnings

      - name: Run os_api tests
        run: cargo test --manifest-path libs/os_api/Cargo.toml

      - name: Run Linux binary tests
        run: cargo test --features linux --bin cpu-affinity-tool-linux

      - name: Verify committed lockfiles
        run: git diff --exit-code -- Cargo.lock libs/os_api/Cargo.lock

      - name: Build Linux binary
        run: cargo build --release --features linux --bin cpu-affinity-tool-linux
