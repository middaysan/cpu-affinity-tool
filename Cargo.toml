[package]
name = "cpu-affinity-tool" 
version = "1.7.0"
edition = "2021"
rust-version = "1.95"
default-run = "cpu-affinity-tool"
description = "Windows utility for managing CPU affinity of games and background applications."
license = "MIT"

[[bin]]
name = "cpu-affinity-tool" 
path = "src/main_windows.rs"
required-features = ["windows"]

[[bin]]
name = "cpu-affinity-tool-linux" 
path = "src/main_linux.rs"
required-features = ["linux"]

[profile.dev]
opt-level = 3               # Use slightly better optimizations.
overflow-checks = false     # Disable integer overflow checks.
debug = true

[dependencies]
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
os_api = { path = "libs/os_api" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
num_cpus = "1.17.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
once_cell = "1.21.4"
regex = "1.13.1"

[target.'cfg(windows)'.dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
subtle = { version = "2.6.1", optional = true }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"], optional = true }
# Windows uses DX12; Linux keeps the shared Glow renderer without WGPU backends.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
tray-icon = "0.26.1"
# Use eframe's existing native window API to synchronize taskbar policy on restore.
winit = { version = "0.30.13", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dev-dependencies]
# Validate advertised MCP contracts in tests, without network/file resolvers.
jsonschema = { version = "=0.56.0", default-features = false }

[features]
windows = ["production-mcp"]
production-mcp = ["dep:rmcp", "dep:axum", "dep:subtle", "dep:tokio-util"]
linux = []
diagnostics-test-controls = []
tuning-test-controls = ["os_api/tuning-test-controls"]
render-profiling = ["os_api/render-profiling"]
debug-mcp = ["render-profiling"]

[patch.crates-io]
# Preserve initial visibility (egui #8459) and allow nonblocking root-frame deferral.
eframe = { path = "vendor/eframe" }

# Retain canonical default variable-font hinting coordinates.
epaint = { path = "vendor/epaint" }

# Backport upstream Windows 11 mixed-DPI positioning fix to the compatible Winit.
winit = { path = "vendor/winit" }
